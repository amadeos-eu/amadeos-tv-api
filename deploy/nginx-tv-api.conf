# Inside the server block of api.amadeos.eu (TLS as for the other amadeOS sites).
# A few requests per second per address are plenty for TV; answers are cached for a few minutes.
#
# In the http block:
#   limit_req_zone $binary_remote_addr zone=tvapi:10m rate=10r/s;
#   proxy_cache_path /var/cache/nginx/tvapi levels=1:2 keys_zone=tvapi:10m max_size=200m inactive=10m;

location /tv/v1/ {
    limit_req zone=tvapi burst=30 nodelay;
    proxy_cache tvapi;
    proxy_cache_valid 200 5m;
    proxy_cache_use_stale error timeout updating;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8085;
}
