name: Build

# develop builds X.Y.Z-dev.N, release X.Y.Z-pre.N and main the release X.Y.Z, which the release job
# tags and publishes with the jar (see CONTRIBUTING.md of datazuul/amadeos, "Commits and versions").
on:
  push:
    branches: [develop, release, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The version is computed from the history since the last release tag.
          fetch-depth: 0
      - id: version
        uses: amadeos-eu/amadeos-ci/version@main
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Plain actions/cache instead of the proprietary enhanced cache that is the v6 default.
          cache-provider: basic
      # The database tests start PostgreSQL with Testcontainers; the runner has Docker.
      - name: Test
        run: ./gradlew test --no-daemon
      - name: Check that the tests ran
        run: |
          count=$(grep -ho 'tests="[0-9]*"' build/test-results/test/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          skipped=$(grep -ho 'skipped="[0-9]*"' build/test-results/test/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "Tests run: $count, skipped: $skipped"
          test "$count" -ge 25
          test "$skipped" -eq 0
      - name: Package
        run: ./gradlew bootJar --no-daemon -PappVersion=${{ steps.version.outputs.version }}
      - name: Check the jar
        run: |
          jar=build/libs/amadeos-tv-api-${{ steps.version.outputs.version }}.jar
          unzip -l "$jar" | grep -q 'db/migration/V1__films.sql'
          unzip -p "$jar" META-INF/build-info.properties | grep -q "build.version=${{ steps.version.outputs.version }}"
      - name: Upload the jar
        uses: actions/upload-artifact@v7
        with:
          name: amadeos-tv-api-jar
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/test

  # Only on main, after the release branch was promoted: tag vX.Y.Z and publish the GitHub Release.
  release:
    needs: test
    if: needs.test.outputs.channel == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: amadeos-tv-api-jar
          path: dist
      - uses: amadeos-eu/amadeos-ci/release@main
        with:
          version: ${{ needs.test.outputs.version }}
          files: dist/*.jar

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: amadeos-eu/amadeos-ci/check-commits@main
